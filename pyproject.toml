[project]
name = "doctronic"
version = "0.1.1"
description = "Python SDK for the Doctronic API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Doctronic" }]
keywords = [
  "doctronic",
  "healthcare",
  "telehealth",
  "api-client",
  "sdk",
  "openapi",
  "webhooks",
  "server-sent-events",
  "pydantic",
  "httpx",
]
# No License classifier: the license is the PEP 639 expression above, and PyPI rejects a
# License classifier next to one.
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://docs.doctronic.ai"
Documentation = "https://docs.doctronic.ai"
Repository = "https://github.com/doctronic-ai/doctronic-sdk-python"
Issues = "https://github.com/doctronic-ai/doctronic-sdk-python/issues"
Changelog = "https://github.com/doctronic-ai/doctronic-sdk-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "datamodel-code-generator==0.84.0",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "respx==0.23.1",
  "ruff==0.17.0",
]

[tool.uv]
# Resolve only releases at least two weeks old. uv works out the cutoff each time it locks, so
# `uv lock --upgrade` and Dependabot (cooldown in .github/dependabot.yml) follow the same rule.
exclude-newer = "14 days"
# The floor applies to security updates too, so a fix released less than two weeks ago doesn't
# resolve until the package is listed here. Each entry is temporary: remove it once the locked
# version is two weeks old. See "Security updates" in CONTRIBUTING.md.
#
# - certifi: GHSA-6q48-6c7w-9gw2 (emSign roots), fixed in 2026.10.18. Remove after 2026-11-06.
exclude-newer-package = { certifi = false }

[build-system]
# 1.27 is the first hatchling with PEP 639 license metadata (`license` as an SPDX expression,
# `license-files`).
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doctronic"]

[tool.hatch.build.targets.sdist]
include = ["src/doctronic", "README.md", "CHANGELOG.md", "LICENSE"]

# Hatchling force-includes the repository's .gitignore in the sdist; hatch_build.py removes it.
[tool.hatch.build.targets.sdist.hooks.custom]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/doctronic/_generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = [
  "E501", # The formatter owns line length.
]

[tool.ruff.lint.isort]
known-first-party = ["doctronic"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "scripts", "examples"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "datamodel_code_generator.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
