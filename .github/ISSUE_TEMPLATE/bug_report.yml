name: Bug report
description: The SDK behaves differently from its documentation or the Doctronic API docs.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never post API tokens, webhook secrets, patient data, or PHI here.** Issues are public. Replace real names, dates of birth, contact details, user IDs, and message text with made-up values, and remove `Authorization` and `X-Doctronic-User-ID` headers from logs.

        Report security vulnerabilities privately at https://github.com/doctronic-ai/doctronic-sdk-python/security/advisories/new, not here.
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: "`python -c \"import doctronic; print(doctronic.__version__)\"`"
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version and OS
      placeholder: Python 3.13 on Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - staging
        - production
        - A mock or local server
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exception and its traceback, with any patient data and credentials removed. The request ID (`err.request_id`, or the `X-Request-ID` header) helps Doctronic trace a failed call.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Code that reproduces it
      description: The smallest program that shows the problem, using synthetic data only.
      render: python
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Before you submit
      options:
        - label: This issue contains no API tokens, webhook secrets, patient data, or PHI.
          required: true
