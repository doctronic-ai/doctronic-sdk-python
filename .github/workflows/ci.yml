name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # 0.13.0 is the first uv release that downloads CPython 3.15.0 final. Keep this the same in
  # every workflow.
  UV_VERSION: "0.13.0"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest

  test-lowest:
    name: Test (lowest supported httpx and pydantic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.10"

      # Re-resolves the runtime dependencies to the floors in pyproject.toml. The change to
      # uv.lock stays in this job.
      - name: Install the lowest direct dependencies
        run: uv sync --resolution lowest-direct

      - name: Test
        run: uv run --no-sync pytest

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: Build the sdist and wheel
        run: uv build

      - name: Check the sdist leaves out VCS ignore files
        run: |
          if tar -tzf dist/doctronic-*.tar.gz | grep -E '/\.(git|hg)ignore$'; then
            echo "::error::The sdist ships a VCS ignore file. hatch_build.py should remove it."
            exit 1
          fi

      - name: Check the wheel ships its types and generated models
        run: |
          wheel=$(ls dist/doctronic-*.whl)
          unzip -l "$wheel" | tee wheel-contents.txt
          grep -q "doctronic/py.typed" wheel-contents.txt
          grep -q "doctronic/_generated/models.py" wheel-contents.txt
          grep -q "doctronic/_generated/operations.py" wheel-contents.txt

      - name: Import the installed wheel
        run: |
          uv venv --python 3.13 /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python dist/doctronic-*.whl
          /tmp/wheel-venv/bin/python -c "import doctronic; print(doctronic.__version__)"

  codegen:
    name: Generated code matches the pinned contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      # From openapi/doctronic-v1.json, the pinned copy of the public contract, so this check
      # only changes when a commit changes the pin or the generator. A new published contract
      # reaches the SDK through a pull request that updates the pin (regenerate.yml), and
      # contract-drift.yml reports when the pin falls behind.
      - name: Regenerate from the pinned contract
        run: uv run python scripts/generate.py

      - name: Fail on any difference
        run: |
          git status --porcelain -- src/doctronic/_generated
          if [ -n "$(git status --porcelain -- src/doctronic/_generated)" ]; then
            git diff -- src/doctronic/_generated
            echo "::error::src/doctronic/_generated is out of date with openapi/doctronic-v1.json. Run scripts/generate.py and commit the result."
            exit 1
          fi
