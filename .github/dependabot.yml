# Version updates wait 14 days after a release, so every dependency is at least two weeks old.
# The cooldown doesn't apply to security updates.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
